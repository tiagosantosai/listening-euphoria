<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter+Tight:wght@800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

#info{position:fixed;inset:0}

#tip{position:fixed;z-index:5;pointer-events:none;background:#111;color:#FFFFFF;font:600 12px/1.45 'Inter',system-ui,sans-serif;padding:8px 10px;border-radius:2px;max-width:250px}

<title>Google · Airbnb Brasil</title></head><body>
<div id="info"></div><div id="tip" hidden></div>
<script src="airbnb-render.js?v=1"></script>
<script>

const days=["JAN/25", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT", "NOV", "DEZ", "JAN/26", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT/26"],dshort=["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D", "J", "F", "M", "A", "M", "J", "J", "A", "S", "O"];const A=[73, 59, 54, 49, 43, 46, 51, 51, 56, 59, 66, 78, 75, 56, 50, 54, 44, 42, 53, 53, 48, 57],B=[46, 38, 37, 37, 33, 34, 35, 32, 35, 37, 43, 47, 47, 37, 35, 36, 30, 35, 38, 36, 32, 31],TOPS=["hotel(100)", "booking(74)", "airbnb sp(47)", "airbnb brasil(35)", "airbnb rio de janeiro(33)", "airbnb aluguel(31)", "airbnb sao paulo(27)", "airbnb rj(19)", "hoteis(19)", "airbnb curitiba(16)"],GEO=["Santa Catarina 100", "Distrito Federal 99", "Rio de Janeiro 85", "Rio Grande do Sul 82", "São Paulo 76", "Paraná 70"];
renderInfo({aria:"Interesse de busca no Google por Airbnb e Booking no Brasil por mês",kicker:"LISTENING / AIRBNB BRASIL / GOOGLE SEARCH / JAN 2025 – OUT 2026",kickerShort:"LISTENING / AIRBNB BRASIL / GOOGLE",
 head:["No Google, o Airbnb é sazonal:", "pico no verão e no Réveillon."],headShort:["Busca sazonal:", "pico no verão."],deck:["O interesse por \"airbnb\" fica, em média, 49% acima de \"booking\" e sobe em nov–jan (fim de ano, verão e Carnaval). São Paulo, Rio e Curitiba lideram as buscas por cidade; Santa Catarina e DF lideram por estado.", "Em alta: \"carnaval 2027\" e \"gift card airbnb\"."],deckShort:["\"airbnb\" fica 49% acima de \"booking\".", "Pico: dez/25 (fim de ano)."],kpis:[{"n": "55", "l": "ÍNDICE MÉDIO \"AIRBNB\"", "ls": "AIRBNB", "c": "#E8352C"}, {"n": "37", "l": "ÍNDICE MÉDIO \"BOOKING\"", "ls": "BOOKING", "c": "#1F5BFF"}, {"n": "Dez/25", "l": "MÊS DE PICO", "ls": "PICO", "c": "#111111"}, {"n": "+4.150%", "l": "\"CARNAVAL 2027\" EM ALTA", "ls": "EM ALTA", "c": "#C98A00"}],legend:[{"t": "— AIRBNB", "c": "#E8352C"}, {"t": "— BOOKING", "c": "#1F5BFF"}],legendShort:[{"t": "— AIRBNB", "c": "#E8352C"}, {"t": "— BOOKING", "c": "#1F5BFF"}],axisNote:'',yLeft:true,yRight:false,noEv:true,foot:"FONTE: EUPHORIA CREATIVE · Google Trends, Brasil, pesquisa na web, 01/01/2025 a 28/10/2026, média mensal do índice semanal (100 = pico do período entre os dois termos). Out/26 parcial.",footShort:["FONTE: EUPHORIA · Google Trends Brasil, índice 0–100,", "média mensal. Out/26 parcial."],
 chart(P){
  const {svg,left,top,bottom,ch,s,compact,C,MONO,DISP,BODY,el,txt,tip,W}=P; let right=P.right;
  const g=el('g',{},svg); const af=Math.max(8,8.5*s);
  if(W>=760){const pw=Math.min(300,(right-left)*0.32); panel(right-pw+10,pw-10); right=right-pw-24}
  const cw=right-left,n=days.length,xs=i=>left+cw*i/(n-1),y=v=>bottom-ch*v/100;
  [0,25,50,75,100].forEach(v=>{el('line',{x1:left,x2:right,y1:y(v),y2:y(v),stroke:C.rule,'stroke-width':v?0.6:0},g);txt(g,left-6,y(v)+3,v,{fill:C.grey,'font-family':MONO,'font-size':af,'text-anchor':'end'})});
  el('polyline',{points:B.map((v,i)=>xs(i)+','+y(v)).join(' '),fill:'none',stroke:'#1F5BFF','stroke-width':Math.max(1.8,2.4*s)},g);
  let d=`M${xs(0)},${bottom}`;A.forEach((v,i)=>d+=` L${xs(i)},${y(v)}`);d+=` L${xs(n-1)},${bottom} Z`;el('path',{d,fill:'#E8352C',opacity:0.10},g);
  el('polyline',{points:A.map((v,i)=>xs(i)+','+y(v)).join(' '),fill:'none',stroke:'#E8352C','stroke-width':Math.max(2.2,3*s)},g);
  el('line',{x1:left,x2:right,y1:bottom,y2:bottom,stroke:C.ink,'stroke-width':1.2},g);
  days.forEach((dd,i)=>{txt(g,xs(i),bottom+af+6,(cw/(n-1))<44?dshort[i]:dd,{fill:C.ink,'font-family':MONO,'font-size':af,'text-anchor':'middle'});
    const w=cw/(n-1);const r=el('rect',{x:xs(i)-w/2,y:top,width:w,height:ch,fill:'transparent'},g);hover(r,tip,`<b>${dd}</b><br>airbnb ${A[i]} · booking ${B[i]}`)});
  const mi=A.indexOf(Math.max(...A));txt(g,xs(mi)+(mi>n-4?-6:6),y(A[mi])-6,String(A[mi]),{fill:'#E8352C','font-family':DISP,'font-size':Math.max(11,13*s),'font-weight':900,'text-anchor':mi>n-4?'end':'start'});
  function panel(x0,pw){const f=Math.max(8,8.5*s);let yy=top+2;el('line',{x1:x0-12,x2:x0-12,y1:top-4,y2:bottom,stroke:C.rule,'stroke-width':1},g);
    txt(g,x0,yy,"BUSCAS RELACIONADAS (TOP)",{fill:C.red,'font-family':MONO,'font-size':f,'font-weight':700});yy+=f*1.6;
    const lh=Math.min(f*1.75,(bottom-top)*0.6/TOPS.length);
    TOPS.forEach((q,k)=>{const m=q.match(/^(.*)\((\d+)\)$/);const nm=m?m[1].trim():q,v=m?+m[2]:0;
      el('rect',{x:x0,y:yy-lh*0.62,width:pw*v/100,height:lh*0.78,fill:k<1?'#F6D7D5':'#F1EFEA'},g);
      txt(g,x0+4,yy,nm,{fill:C.ink,'font-family':BODY,'font-size':Math.max(8.5,lh*0.62),'font-weight':600});txt(g,x0+pw,yy,v,{fill:C.grey,'font-family':MONO,'font-size':f,'text-anchor':'end'});yy+=lh});
    yy+=f*1.2;txt(g,x0,yy,"ESTADOS COM MAIS INTERESSE",{fill:C.red,'font-family':MONO,'font-size':f,'font-weight':700});yy+=f*1.5;
    const gl=Math.max(f*1.3,(bottom-yy)/GEO.length);GEO.forEach(q=>{if(yy>bottom)return;txt(g,x0,yy,q,{fill:C.ink,'font-family':MONO,'font-size':f});yy+=gl})}
 }});

</script>
