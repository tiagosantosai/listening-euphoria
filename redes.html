<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter+Tight:wght@800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#FFFFFF}
#info{position:fixed;inset:0}
#info svg{display:block}
#tip{position:fixed;z-index:5;pointer-events:none;background:#111;color:#FFFFFF;font:600 12px/1.45 'Inter',system-ui,sans-serif;padding:8px 10px;border-radius:2px;max-width:240px}
#tip b{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;color:#FFFFFF}
</style>

<title>Impactos nas redes · Listening Ivete & Daniela</title></head><body>
<div id="info"></div><div id="tip" hidden></div>
<script>
// Infográficos do listening — SVG responsivo que sempre cabe na janela (sem rolagem)
(function(){
const C={paper:'#FFFFFF',ink:'#111111',red:'#E8352C',blue:'#1F5BFF',grey:'#8A867D',rule:'#CFCAC0'};
const DISP="'Inter Tight','Inter',system-ui,sans-serif", MONO="'IBM Plex Mono','DejaVu Sans Mono',monospace", BODY="'Inter',system-ui,sans-serif";
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,o){const t=el('text',Object.assign({x,y},o),p);t.textContent=s;return t}
function fmtBR(v,d){return v.toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function lines(p,x,y,arr,o,lh){arr.forEach((s,i)=>txt(p,x,y+i*lh,s,o))}

window.renderInfo=function(D){
  const root=document.getElementById('info'); const tip=document.getElementById('tip');
  function draw(){
    root.innerHTML='';
    const W=window.innerWidth,H=window.innerHeight;
    const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':D.aria},root);
    el('rect',{x:0,y:0,width:W,height:H,fill:C.paper},svg);
    const compact=W<620, tiny=H<380, mid=W<1200;
    const pad=Math.max(14,Math.min(W*0.035,40));
    const s=Math.max(0.62,Math.min(W/1100,H/700,1.25)); // escala tipográfica
    let y=pad;
    // kicker
    const kf=Math.max(9,11*s);
    txt(svg,pad,y+kf,compact?D.kickerShort:D.kicker,{fill:C.red,'font-family':MONO,'font-size':kf,'font-weight':700,'letter-spacing':'0.04em'});
    y+=kf+8*s;
    // headline
    const hf=Math.max(19,Math.min(44*s,W*(compact?0.075:0.045)));
    const hl=compact?D.headShort:D.head;
    txt(svg,pad,y+hf*0.9,hl[0],{fill:C.ink,'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'});
    y+=hf*1.02;
    if(hl[1]){txt(svg,pad,y+hf*0.9,hl[1],{fill:C.grey,'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'});y+=hf*1.02}
    // deck (só quando há espaço)
    const showDeck=!tiny&&H>460;
    if(showDeck){const df=Math.max(11,13*s);y+=6*s;lines(svg,pad,y+df,compact?D.deckShort:D.deck,{fill:C.ink,'font-family':BODY,'font-size':df},df*1.4);y+=df*1.4*(compact?D.deckShort:D.deck).length}
    // KPIs
    y+=10*s;
    const kN=D.kpis.length, kw=(W-2*pad)/kN, nf=Math.max(18,Math.min(30*s,kw*0.28)), lf=Math.max(8.5,9.5*s);
    D.kpis.forEach((k,i)=>{const x=pad+i*kw;
      el('rect',{x,y,width:kw-10*s,height:3,fill:k.c},svg);
      txt(svg,x,y+8+nf,k.n,{fill:k.c,'font-family':DISP,'font-size':nf,'font-weight':900,'letter-spacing':'-0.02em'});
      txt(svg,x,y+8+nf+lf+5,mid?k.ls:k.l,{fill:C.ink,'font-family':MONO,'font-size':lf,'font-weight':700});});
    y+=8+nf+lf+5+14*s;
    // legenda
    const gf=Math.max(8.5,9.5*s); let gx=pad;
    D.legend.forEach(g=>{const t=txt(svg,gx,y+gf,g.t,{fill:g.c,'font-family':MONO,'font-size':gf,'font-weight':700});gx+=t.getComputedTextLength()+16*s});
    if(D.axisNote&&!compact)txt(svg,W-pad,y+gf,D.axisNote,{fill:C.grey,'font-family':MONO,'font-size':gf*0.9,'text-anchor':'end'});
    y+=gf+6*s;
    // área do gráfico
    const foot=Math.max(9,9*s)*(mid?2:1)*1.5+8;
    const evRoom=(compact?2:2)*Math.max(8,9*s)*1.25+10;
    const top=y+evRoom, bottom=H-pad-foot-Math.max(10,11*s)-6;
    const left=pad+(D.yLeft?Math.max(26,34*s):0), right=W-pad-(D.yRight?Math.max(30,40*s):0);
    const cw=right-left, ch=Math.max(60,bottom-top);
    D.chart({svg,left,right,top,bottom:top+ch,cw,ch,s,compact,C,MONO,DISP,BODY,el,txt,tip,W,H});
    // rodapé
    const ff=Math.max(8,8.5*s);
    lines(svg,pad,H-pad-(mid?ff*1.5:0),mid?D.footShort:[D.foot],{fill:C.grey,'font-family':MONO,'font-size':ff},ff*1.5);
  }
  draw(); let t; window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,80)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
};
window.showTip=function(tip,html,x,y){tip.innerHTML=html;tip.hidden=false;const r=tip.getBoundingClientRect();let L=x+12,T=y-r.height-10;if(L+r.width>innerWidth-6)L=x-r.width-12;if(L<6)L=6;if(T<6)T=y+14;tip.style.left=L+'px';tip.style.top=T+'px'};
})();

</script>
<script>
function placeEvents(g,ev,xs,yTop,P,valY){
  const f=Math.max(8,9*P.s), lh=f*1.25, ends=[-1e9,-1e9];
  ev.forEach(e=>{const x=xs(e.i), lab=P.compact?e.short:e.long.replace('\n',' ');
    const w=lab.length*f*0.62; let r=1; if(x-w/2<ends[1]+8){r=0} if(r===0&&x-w/2<ends[0]+8){r=1}
    ends[r]=x+w/2; const ty=yTop-(r?0:lh);
    let ax='middle',tx=x; if(x+w/2>P.W-6){ax='end';tx=x+4} if(x-w/2<6){ax='start';tx=x-4}
    P.el('line',{x1:x,x2:x,y1:ty+3,y2:Math.max(ty+4,valY(e.i)-5),stroke:P.C.ink,'stroke-width':0.7,'stroke-dasharray':'1 2'},g);
    P.txt(g,tx,ty,lab,{fill:P.C.ink,'font-family':P.MONO,'font-size':f,'font-weight':700,'text-anchor':ax});
  });
}
</script>

<script>
const days=["05/10", "06/10", "07/10", "08/10", "09/10", "10/10", "11/10", "12/10", "13/10", "14/10", "15/10", "16/10", "17/10", "18/10", "19/10"];
const imp=[0.0, 1.87, 0.51, 0.22, 0.36, 14.67, 4.22, 0.05, 6.87, 0.45, 1.72, 0.19, 0.01, 5.05, 0.33];
const inter=[0.2, 380.0, 266.5, 11.8, 33.5, 1542.1, 794.7, 2.3, 548.4, 31.2, 103.4, 19.4, 10.5, 1020.3, 80.3];
const press=[0, 0.62, 7.09, 1.08, 0.72, 2.09, 6.5, 0, 7.1, 1.98, 0, 4.55, 3.97, 4.62, 0.04];
const nmat=[0, 2, 42, 11, 2, 12, 18, 0, 19, 7, 1, 22, 4, 25, 3];
const conv=[0.0, 93.6, 44.6, 2.4, 2.5, 191.2, 73.3, 0.6, 24.4, 1.9, 4.7, 2.0, 1.0, 89.0, 7.1];
const ev=[{i:1,long:'DANIELA DECLARA\nVOTO EM LULA',short:'VOTO'},{i:2,long:'DANIELA\nCOBRA IVETE',short:'COBRANÇA'},{i:5,long:'IVETE PEDE\n"LUCIDEZ"',short:'LUCIDEZ'},{i:6,long:'MARCHA NA\nPAULISTA',short:'MARCHA'},{i:8,long:'MORRE\nNETINHO',short:'NETINHO'},{i:11,long:'IVETE NA\nPROPAGANDA',short:'PROPAG.'},{i:13,long:'ATO EM\nSALVADOR',short:'ATO'}];
renderInfo({aria:'Impactos, interações e conversas nas redes por dia, de 5 a 15 de outubro de 2026',
 kicker:'LISTENING / IVETE SANGALO & DANIELA MERCURY / 05–19 OUT 2026', kickerShort:'IVETE & DANIELA / 05–19 OUT',
 head:['14,7 milhões de views em um único dia.'], headShort:['14,7 mi de views','em um único dia.'],
 deck:['A "lucidez" de Ivete (10/10) segue como o maior pico. O ato de Daniela em Salvador (18/10) teve o 2º maior volume de interações:','1 mi, com 5 mi de views nas redes e 4,6 mi de alcance potencial na imprensa no mesmo dia.'],
 deckShort:['Ato de Daniela (18/10): 2º maior dia','em interações (1 mi), com 5 mi de views.'],
 kpis:[{n:'36,5 mi',l:'VIEWS NAS REDES',ls:'VIEWS',c:'#111111'},{n:'40,4 mi',l:'ALCANCE POTENCIAL · IMPRENSA*',ls:'IMPRENSA*',c:'#1F5BFF'},{n:'4,8 mi',l:'INTERAÇÕES',ls:'INTERAÇÕES',c:'#E8352C'},{n:'538 mil',l:'CONVERSAS · COMENTÁRIOS',ls:'COMENTÁRIOS',c:'#C98A00'}],
 legend:[{t:'■ VIEWS',c:'#111111'},{t:'— INTERAÇÕES',c:'#E8352C'},{t:'··· COMENTÁRIOS',c:'#C98A00'},{t:'■ IMPRENSA*',c:'#1F5BFF'}],
 axisNote:'EIXO DIREITO, EM VERMELHO: INTERAÇÕES E COMENTÁRIOS · ESCALA 10× MAIOR', yLeft:true, yRight:true,
 foot:'FONTE: EUPHORIA CREATIVE · Views = reels do Instagram + TikTok. *Imprensa: audiência média diária dos veículos que publicaram no dia (Comscore ago/26, visitantes únicos ÷ 30) — teto potencial, não leitura da matéria. 19/10 parcial.',
 footShort:['FONTE: EUPHORIA · *Imprensa = audiência diária dos veículos','(Comscore ago/26): teto potencial, não leitura. 19/10 parcial.'],
 chart(P){
  const {svg,left,right,top,bottom,cw,ch,s,compact,C,MONO,DISP,el,txt,tip}=P;
  const n=days.length, xs=i=>left+cw*(i/(n-1)), yL=v=>bottom-ch*v/16.5, yR=v=>bottom-ch*v/1750;
  const g=el('g',{},svg); const af=Math.max(8,8.5*s);
  [0,5,10,15].forEach(v=>{txt(g,left-6,yL(v)+3,v?v+' mi':'0',{fill:C.grey,'font-family':MONO,'font-size':af,'text-anchor':'end'})});
  [0,500,1000,1500].forEach(v=>{txt(g,right+6,yR(v)+3,v?(v>=1000?fmt(v/1000)+' mi':v+' mil'):'0',{fill:C.red,'font-family':MONO,'font-size':af})});
  txt(g,right+6,yR(1750)+3,'10×',{fill:C.red,'font-family':MONO,'font-size':af,'font-weight':700});
  function fmt(v){return v.toLocaleString('pt-BR',{maximumFractionDigits:1})}
  const vf0=Math.max(10,12*s);
  let d=`M${xs(0)},${bottom}`; imp.forEach((v,i)=>d+=` L${xs(i)},${yL(v)}`); d+=` L${xs(n-1)},${bottom} Z`;
  el('path',{d,fill:C.ink,opacity:0.92},g);
  const defs=el('defs',{},svg);const pat=el('pattern',{id:'hatch',width:5,height:5,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
  el('rect',{width:5,height:5,fill:'#FFFFFF'},pat);el('line',{x1:0,y1:0,x2:0,y2:5,stroke:'#1F5BFF','stroke-width':2.2},pat);
  const bw=Math.max(6,cw/(n-1)*0.42);
  press.forEach((v,i)=>{if(!v)return;el('rect',{x:xs(i)-bw/2,y:yL(v),width:bw,height:bottom-yL(v),fill:'#1F5BFF'},g)});
  if(!compact){txt(g,xs(2)+bw/2+4,yL(7.09)+10,'7,1 mi',{fill:'#1F5BFF','font-family':DISP,'font-size':vf0,'font-weight':900});}
  el('polyline',{points:inter.map((v,i)=>xs(i)+','+yR(v)).join(' '),fill:'none',stroke:C.red,'stroke-width':Math.max(1.8,2.4*s),'stroke-linejoin':'round'},g);
  el('polyline',{points:conv.map((v,i)=>xs(i)+','+yR(v)).join(' '),fill:'none',stroke:'#C98A00','stroke-width':Math.max(1.8,2.2*s),'stroke-dasharray':'2 3','stroke-linecap':'round'},g);
  el('line',{x1:left,x2:right,y1:bottom,y2:bottom,stroke:C.ink,'stroke-width':1.2},g);
  const step=compact&&cw<330?2:1;
  days.forEach((dd,i)=>{if(i%step)return;txt(g,xs(i),bottom+af+6,compact?dd.slice(0,2):dd,{fill:C.ink,'font-family':MONO,'font-size':af,'text-anchor':'middle'})});
  // rótulos diretos
  const vf=Math.max(10,12*s);
  txt(g,xs(5)-6,yL(14.67)-6,compact?'14,7 mi':'14,7 mi views',{fill:C.ink,'font-family':DISP,'font-size':vf,'font-weight':900,'text-anchor':'end'});
  if(!compact)txt(g,xs(13)+Math.max(6,cw/(n-1)*0.42)/2+5,yL(5.05)-4,'5,1 mi',{fill:C.ink,'font-family':DISP,'font-size':vf,'font-weight':900});
  txt(g,xs(8)-Math.max(6,cw/(n-1)*0.42)/2-5,yL(6.87)-4,'6,9 mi',{fill:C.ink,'font-family':DISP,'font-size':vf,'font-weight':900,'text-anchor':'end'});
  placeEvents(g,ev,xs,top-4,P,i=>Math.min(yL(imp[i]),yR(inter[i])));
  // interação: toque/passar o mouse
  days.forEach((dd,i)=>{const w=cw/(n-1);const r=el('rect',{x:xs(i)-w/2,y:top,width:w,height:ch,fill:'transparent'},g);
    const h=e=>{const p=e.touches?e.touches[0]:e;showTip(tip,`<b>${dd}</b><br>${fmt(imp[i])} mi views<br>${fmt(inter[i])} mil interações<br>${fmt(conv[i])} mil comentários<br>${nmat[i]} matérias · ${fmt(press[i])} mi de audiência potencial`,p.clientX,p.clientY)};
    r.addEventListener('mousemove',h);r.addEventListener('touchstart',h,{passive:true});r.addEventListener('mouseleave',()=>tip.hidden=true)});
 }});
</script></body></html>
