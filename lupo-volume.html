<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter+Tight:wght@800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#FFFFFF}
#info{position:fixed;inset:0}
#info svg{display:block}
#tip{position:fixed;z-index:5;pointer-events:none;background:#111;color:#FFFFFF;font:600 12px/1.45 'Inter',system-ui,sans-serif;padding:8px 10px;border-radius:2px;max-width:250px}
#tip b{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;color:#FFFFFF}
</style>
<title>Imprensa e TikTok · Listening Lupo</title></head><body>
<div id="info"></div><div id="tip" hidden></div>
<script>
(function(){
const C={paper:'#FFFFFF',ink:'#111111',red:'#E8352C',blue:'#1F5BFF',grey:'#8A867D',rule:'#CFCAC0'};
const DISP="'Inter Tight','Inter',system-ui,sans-serif", MONO="'IBM Plex Mono','DejaVu Sans Mono',monospace", BODY="'Inter',system-ui,sans-serif";
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,o){const t=el('text',Object.assign({x,y},o),p);t.textContent=s;return t}
function lines(p,x,y,arr,o,lh){arr.forEach((s,i)=>txt(p,x,y+i*lh,s,o))}
window.renderInfo=function(D){
  const root=document.getElementById('info'); const tip=document.getElementById('tip');
  function draw(){
    root.innerHTML='';
    const W=window.innerWidth,H=window.innerHeight;
    const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':D.aria},root);
    el('rect',{x:0,y:0,width:W,height:H,fill:C.paper},svg);
    const compact=W<620, tiny=H<380, mid=W<1200;
    const pad=Math.max(14,Math.min(W*0.035,40));
    const s=Math.max(0.62,Math.min(W/1100,H/700,1.25));
    let y=pad;
    const kf=Math.max(9,11*s);
    const avail=W-2*pad;
    {const ko={fill:C.red,'font-family':MONO,'font-size':kf,'font-weight':700,'letter-spacing':'0.04em'};
     let kt=txt(svg,pad,y+kf,compact?D.kickerShort:D.kicker,ko);
     if(kt.getComputedTextLength()>avail&&D.kickerShort&&!compact){kt.remove();kt=txt(svg,pad,y+kf,D.kickerShort,ko)}
     const kl=kt.getComputedTextLength(); if(kl>avail)kt.setAttribute('font-size',kf*avail/kl*0.98);}
    y+=kf+8*s;
    let hf=Math.max(19,Math.min(44*s,W*(compact?0.075:0.045)));
    const hl=compact?D.headShort:D.head;
    {const probe=hl.map(t=>txt(svg,0,-100,t,{'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'}));
     const mw=Math.max(...probe.map(t=>t.getComputedTextLength())); probe.forEach(t=>t.remove()); if(mw>avail)hf=hf*avail/mw*0.98;}
    txt(svg,pad,y+hf*0.9,hl[0],{fill:C.ink,'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'});
    y+=hf*1.08;
    if(hl[1]){txt(svg,pad,y+hf*0.9,hl[1],{fill:C.grey,'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'});y+=hf*1.08}
    const showDeck=!tiny&&H>460;
    if(showDeck){const df=Math.max(11,13*s);y+=6*s;
      const src=compact?D.deckShort:D.deck, o={fill:C.ink,'font-family':BODY,'font-size':df}, out=[];
      src.forEach(par=>{const words=par.split(' ');let cur='';const pr=txt(svg,0,-100,'',o);
        words.forEach(w=>{const t=cur?cur+' '+w:w;pr.textContent=t;if(pr.getComputedTextLength()>avail&&cur){out.push(cur);cur=w}else cur=t});
        if(cur)out.push(cur);pr.remove();});
      lines(svg,pad,y+df,out,o,df*1.4);y+=df*1.4*out.length}
    y+=10*s;
    const kN=D.kpis.length, kw=(W-2*pad)/kN, nf=Math.max(18,Math.min(30*s,kw*0.28)), lf=Math.max(8.5,9.5*s);
    D.kpis.forEach((k,i)=>{const x=pad+i*kw;
      el('rect',{x,y,width:kw-10*s,height:3,fill:k.c},svg);
      txt(svg,x,y+8+nf,k.n,{fill:k.c,'font-family':DISP,'font-size':nf,'font-weight':900,'letter-spacing':'-0.02em'});
      const lt=txt(svg,x,y+8+nf+lf+5,(W<1000)?k.ls:k.l,{fill:C.ink,'font-family':MONO,'font-size':lf,'font-weight':700});
      const ll=lt.getComputedTextLength(); if(ll>kw-12)lt.setAttribute('font-size',lf*(kw-12)/ll);});
    y+=8+nf+lf+5+14*s;
    const gf=Math.max(8.5,9.5*s); let gx=pad;
    ((compact&&D.legendShort)?D.legendShort:D.legend).forEach(g=>{const t=txt(svg,gx,y+gf,g.t,{fill:g.c,'font-family':MONO,'font-size':gf,'font-weight':700});gx+=t.getComputedTextLength()+16*s});
    if(D.axisNote&&W>=1000)txt(svg,W-pad,y+gf,D.axisNote,{fill:C.grey,'font-family':MONO,'font-size':gf*0.9,'text-anchor':'end'});
    y+=gf+6*s;
    const foot=Math.max(9,9*s)*2*1.5+8;
    const evRoom=2*Math.max(8,9*s)*1.25+10;
    const top=y+evRoom, bottom=H-pad-foot-Math.max(10,11*s)-6;
    const left=pad+(D.yLeft?Math.max(26,34*s):0), right=W-pad-(D.yRight?Math.max(30,40*s):0);
    const cw=right-left, ch=Math.max(60,bottom-top);
    D.chart({svg,left,right,top,bottom:top+ch,cw,ch,s,compact,C,MONO,DISP,BODY,el,txt,tip,W,H});
    const ff=Math.max(8,8.5*s);
    {const fo={fill:C.grey,'font-family':MONO,'font-size':ff};let useShort=mid;
     if(!useShort){const pr=txt(svg,0,-100,D.foot,fo);if(pr.getComputedTextLength()>avail)useShort=true;pr.remove()}
     const fl=useShort?D.footShort:[D.foot];
     const ts=fl.map((t,i)=>txt(svg,pad,H-pad-(fl.length-1-i)*ff*1.5,t,fo));
     const mw=Math.max(...ts.map(t=>t.getComputedTextLength()));if(mw>avail)ts.forEach(t=>t.setAttribute('font-size',ff*avail/mw*0.98));}
  }
  draw(); let t; window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,80)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
};
window.showTip=function(tip,html,x,y){tip.innerHTML=html;tip.hidden=false;const r=tip.getBoundingClientRect();let L=x+12,T=y-r.height-10;if(L+r.width>innerWidth-6)L=x-r.width-12;if(L<6)L=6;if(T<6)T=y+14;tip.style.left=L+'px';tip.style.top=T+'px'};
})();
</script>
<script>
function placeEvents(g,ev,xs,yTop,P,valY){
  const f=Math.max(8,9*P.s), lh=f*1.25, ends=[-1e9,-1e9];
  ev.forEach(e=>{const x=xs(e.i), lab=P.compact?e.short:e.long;
    const w=lab.length*f*0.62; let r=1; if(x-w/2<ends[1]+8){r=0} if(r===0&&x-w/2<ends[0]+8){r=1}
    ends[r]=x+w/2; const ty=yTop-(r?0:lh);
    let ax='middle',tx=x; if(x+w/2>P.W-6){ax='end';tx=x+4} if(x-w/2<6){ax='start';tx=x-4}
    P.el('line',{x1:x,x2:x,y1:ty+3,y2:Math.max(ty+4,valY(e.i)-5),stroke:P.C.ink,'stroke-width':0.7,'stroke-dasharray':'1 2'},g);
    P.txt(g,tx,ty,lab,{fill:P.C.ink,'font-family':P.MONO,'font-size':f,'font-weight':700,'text-anchor':ax});
  });
}
</script>
<script>
const days=['OUT/25','NOV','DEZ','JAN/26','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT/26'];
const dshort=['O','N','D','J','F','M','A','M','J','J','A','S','O'];
const PA=[0,7,1,2,1,0,0,2,0,0,6,1,0], NE=[0,1,0,2,0,3,0,8,0,1,2,2,0], CO=[0,0,1,0,0,0,1,0,0,0,5,0,0], PR=[0,0,3,0,0,0,0,0,1,0,5,0,0], SP=[1,0,0,0,0,3,1,1,0,0,1,0,0];
const ttP=[0,9,2,0,4,3,2,6,1,3,0,2,3], ttA=[0,0,1,0,2,2,0,0,6,4,12,6,8], ttO=[0,2,4,2,1,2,5,3,2,3,7,4,5];
const tot=days.map((_,i)=>PA[i]+NE[i]+CO[i]+PR[i]+SP[i]);
const YMAX=20, TICKS=[0,5,10,15,20];
const ev=[{i:1,long:'"O BRASIL EMPURROU"',short:'PARAGUAI'},{i:5,long:'105 ANOS + CORRE 15 CIDADES',short:'105 ANOS'},{i:7,long:'CEO DE FORA DA FAMÍLIA',short:'NOVO CEO'},{i:10,long:'iFOOD, LOBO, DIRETORIA, CHECAGENS',short:'iFOOD+CHECAG.'}];
const COL=['#E8352C','#111111','#1F5BFF','#7B3FE4','#C98A00'];
const who=[{p:'PARAGUAI E IMPOSTOS',n:35,v:'3,6 mi',r:52,c0:'#E8352C'},{p:'USO E REVIEWS',n:40,v:'4,7 mi',r:30,c0:'#111111'},{p:'AFILIADOS / TIKTOK SHOP',n:41,v:'4,4 mi',r:4,c0:'#C98A00'}];
renderInfo({aria:'Matérias sobre a Lupo por mês e por frente, de outubro de 2025 a outubro de 2026, e vídeos de terceiros no TikTok por tema',
 kicker:'LISTENING / LUPO · MOMENTO DE MARCA / IMPRENSA E TIKTOK DE TERCEIROS / OUT 2025 – OUT 2026', kickerShort:'LUPO / IMPRENSA E TIKTOK',
 head:['Paraguai abre e fecha o ano.','No meio, sucessão e novos negócios.'], headShort:['Paraguai abre e fecha.','No meio, sucessão e negócios.'],
 deck:['62 matérias em 12 meses. Paraguai e impostos (20) e negócios e gestão (19) lideram; campanhas aparecem pouco na imprensa (7). Agosto/26 concentra 19 itens: iFood, marca Lobo, nova diretoria de marketing e checagens de quatro agências.','No TikTok de terceiros, os vídeos sobre o Paraguai engajam 13 vezes mais que os de afiliados, que dominam desde jun/26.'],
 deckShort:['62 matérias. Paraguai (20) e negócios (19) lideram.','Ago/26: iFood, Lobo, diretoria e checagens.'],
 kpis:[{n:'62',l:'MATÉRIAS NA IMPRENSA',ls:'MATÉRIAS',c:'#111111'},{n:'20',l:'SOBRE PARAGUAI E IMPOSTOS',ls:'PARAGUAI',c:'#E8352C'},{n:'4',l:'AGÊNCIAS DE CHECAGEM (AGO/26)',ls:'CHECAGEM',c:'#1F5BFF'},{n:'116',l:'VÍDEOS DE TERCEIROS NO TIKTOK',ls:'TIKTOK 3OS',c:'#C98A00'}],
 legend:[{t:'■ PARAGUAI E IMPOSTOS',c:COL[0]},{t:'■ NEGÓCIOS E GESTÃO',c:COL[1]},{t:'■ COMUNICAÇÃO',c:COL[2]},{t:'■ PRODUTO E CANAIS',c:COL[3]},{t:'■ LUPO SPORT',c:COL[4]}],
 legendShort:[{t:'■ PARAG.',c:COL[0]},{t:'■ NEGÓC.',c:COL[1]},{t:'■ COMUN.',c:COL[2]},{t:'■ PROD.',c:COL[3]},{t:'■ SPORT',c:COL[4]}],
 axisNote:'', yLeft:true, yRight:false,
 foot:'FONTE: EUPHORIA CREATIVE · matérias por mês de publicação (Bing Notícias e busca web). Porte (Comscore ago/26): 4 grandes, 13 médios, 5 pequenos, 40 fora do ranking. TikTok: vídeos de terceiros com "Lupo" na legenda. Out/25 desde 23/10; out/26 parcial.',
 footShort:['FONTE: EUPHORIA · matérias por mês; porte Comscore: 4 grandes, 13 médios, 45 menores.','TikTok: vídeos de terceiros com "Lupo" na legenda. Out/26 parcial.'],
 chart(P){
  const {svg,left,top,bottom,ch,s,compact,C,MONO,DISP,el,txt,tip,W}=P; let right=P.right;
  const g=el('g',{},svg); const af=Math.max(8,8.5*s);
  const panel=W>=760; if(panel){const pw=Math.min(300,(right-left)*0.3); drawWho(right-pw+10,pw-10); right=right-pw-24}
  const cw=right-left, n=days.length, bw=cw/n, gap=Math.max(3,bw*0.22), xs=i=>left+bw*i+bw/2, y=v=>bottom-ch*v/YMAX;
  TICKS.forEach(v=>{el('line',{x1:left,x2:right,y1:y(v),y2:y(v),stroke:C.rule,'stroke-width':v?0.6:0},g);txt(g,left-6,y(v)+3,v,{fill:C.grey,'font-family':MONO,'font-size':af,'text-anchor':'end'})});
  days.forEach((dd,i)=>{let b=0;[PA,NE,CO,PR,SP].forEach((a,k)=>{const v=a[i];if(v){el('rect',{x:left+bw*i+gap/2,y:y(b+v),width:bw-gap,height:y(b)-y(b+v),fill:COL[k]},g);const hgt=y(b)-y(b+v);if(hgt>af*1.4&&bw>26)txt(g,xs(i),y(b+v/2)+3.5,v,{fill:C.paper,'font-family':MONO,'font-size':af,'text-anchor':'middle','font-weight':700})}b+=v});
    if(tot[i])txt(g,xs(i),y(tot[i])-5,tot[i],{fill:C.ink,'font-family':DISP,'font-size':Math.max(10,12*s),'font-weight':900,'text-anchor':'middle'});
    txt(g,xs(i),bottom+af+6,bw<44?dshort[i]:dd,{fill:C.ink,'font-family':MONO,'font-size':af,'text-anchor':'middle'});
    const r=el('rect',{x:left+bw*i,y:top,width:bw,height:ch,fill:'transparent'},g);
    const h=e=>{const p=e.touches?e.touches[0]:e;showTip(tip,`<b>${dd}</b><br>${tot[i]} matérias<br>Paraguai ${PA[i]} · Negócios ${NE[i]}<br>Comunicação ${CO[i]} · Produto ${PR[i]} · Sport ${SP[i]}<br>TikTok de terceiros: ${ttP[i]+ttA[i]+ttO[i]} vídeos (Paraguai ${ttP[i]}, afiliados ${ttA[i]}, uso ${ttO[i]})`,p.clientX,p.clientY)};
    r.addEventListener('mousemove',h);r.addEventListener('touchstart',h,{passive:true});r.addEventListener('mouseleave',()=>tip.hidden=true)});
  el('line',{x1:left,x2:right,y1:bottom,y2:bottom,stroke:C.ink,'stroke-width':1.2},g);
  placeEvents(g,ev,xs,top-4,P,i=>y(tot[i])-14);
  function drawWho(x0,pw){
    const f=Math.max(8,8.5*s); let yy=top-4;
    txt(g,x0,yy,'TIKTOK DE TERCEIROS · 116 VÍDEOS',{fill:C.red,'font-family':MONO,'font-size':f,'font-weight':700});
    el('line',{x1:x0-12,x2:x0-12,y1:top-14,y2:bottom,stroke:C.rule,'stroke-width':1},g);
    const rowH=(bottom-yy-8)/who.length;
    who.forEach((w,k)=>{const ry=yy+8+k*rowH; const nf=Math.min(rowH*0.3,20*s);
      const tt=txt(g,x0,ry+nf,w.p,{fill:w.c0,'font-family':DISP,'font-size':nf*0.8,'font-weight':900});
      const tl=tt.getComputedTextLength(); if(tl>pw)tt.setAttribute('font-size',nf*0.8*pw/tl);
      txt(g,x0,ry+nf+f*1.6,w.n+' vídeos · '+w.v+' views',{fill:C.grey,'font-family':MONO,'font-size':f});
      const by=ry+nf+f*2.4, bh=Math.max(5,rowH*0.12);
      el('rect',{x:x0,y:by,width:pw,height:bh,fill:'#EFEDE8'},g);
      el('rect',{x:x0,y:by,width:pw*w.r/60,height:bh,fill:w.c0},g);
      txt(g,x0,by+bh+f*1.3,w.r+' CURTIDAS A CADA 1.000 VIEWS',{fill:w.c0,'font-family':MONO,'font-size':f,'font-weight':700})});
  }
 }});
</script>
</body></html>
