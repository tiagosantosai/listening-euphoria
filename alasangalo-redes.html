<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#FFFFFF}
#info{position:fixed;inset:0}
#info svg{display:block}
#tip{position:fixed;z-index:5;pointer-events:none;background:#0F3B37;color:#FFFFFF;font:600 12px/1.45 'Inter',system-ui,sans-serif;padding:8px 10px;border-radius:2px;max-width:250px;border-left:3px solid #C9A04E}
#tip b{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;color:#E9C987}
</style>
<title>Impactos nas redes · A La Sangalo adiado</title></head><body>
<div id="info"></div><div id="tip" hidden></div>
<script>
// Infográficos do listening — SVG responsivo que sempre cabe na janela (sem rolagem). Paleta "A La Sangalo".
(function(){
const C={paper:'#FFFFFF',ink:'#0F3B37',red:'#B3202A',blue:'#0F4A43',grey:'#8A867D',rule:'#DCD4C4',gold:'#B8892E',pink:'#E0566B'};
window.PAL=C;
const DISP="'Playfair Display',Georgia,serif", MONO="'IBM Plex Mono','DejaVu Sans Mono',monospace", BODY="'Inter',system-ui,sans-serif";
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,o){const t=el('text',Object.assign({x,y},o),p);t.textContent=s;return t}
function lines(p,x,y,arr,o,lh){arr.forEach((s,i)=>txt(p,x,y+i*lh,s,o))}
function fitText(t,maxW,minF){let f=parseFloat(t.getAttribute('font-size'));while(t.getComputedTextLength()>maxW&&f>minF){f-=0.5;t.setAttribute('font-size',f)}}
window.renderInfo=function(D){
  const root=document.getElementById('info'); const tip=document.getElementById('tip');
  function draw(){
    root.innerHTML='';
    const W=window.innerWidth,H=window.innerHeight;
    const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':D.aria},root);
    el('rect',{x:0,y:0,width:W,height:H,fill:C.paper},svg);
    const compact=W<620, tiny=H<380, mid=W<1200;
    const pad=Math.max(14,Math.min(W*0.035,40));
    const s=Math.max(0.62,Math.min(W/1100,H/700,1.25));
    let y=pad;
    const kf=Math.max(9,11*s);
    const kt=txt(svg,pad,y+kf,compact?D.kickerShort:D.kicker,{fill:C.red,'font-family':MONO,'font-size':kf,'font-weight':700,'letter-spacing':'0.04em'});fitText(kt,W-2*pad,7);
    y+=kf+8*s;
    const hf=Math.max(20,Math.min(44*s,W*(compact?0.078:0.045)));
    const hl=compact?D.headShort:D.head;
    const h1=txt(svg,pad,y+hf*0.9,hl[0],{fill:C.ink,'font-family':DISP,'font-size':hf,'font-weight':900});fitText(h1,W-2*pad,14);
    y+=hf*1.06;
    if(hl[1]){const h2=txt(svg,pad,y+hf*0.9,hl[1],{fill:C.gold,'font-family':DISP,'font-size':hf,'font-weight':900});fitText(h2,W-2*pad,14);y+=hf*1.06}
    const showDeck=!tiny&&H>460;
    if(showDeck){const df=Math.max(11,13*s);y+=6*s;const dk=compact?D.deckShort:D.deck;dk.forEach((l,i)=>{const t=txt(svg,pad,y+df+i*df*1.4,l,{fill:C.ink,'font-family':BODY,'font-size':df});fitText(t,W-2*pad,9)});y+=df*1.4*dk.length}
    y+=10*s;
    const kN=D.kpis.length, kw=(W-2*pad)/kN, nf=Math.max(18,Math.min(30*s,kw*0.26)), lf=Math.max(8,9.5*s);
    D.kpis.forEach((k,i)=>{const x=pad+i*kw;
      el('rect',{x,y,width:kw-10*s,height:3,fill:k.c},svg);
      const nt=txt(svg,x,y+8+nf,k.n,{fill:k.c,'font-family':DISP,'font-size':nf,'font-weight':900});fitText(nt,kw-12*s,12);
      const lt=txt(svg,x,y+8+nf+lf+5,mid?k.ls:k.l,{fill:C.ink,'font-family':MONO,'font-size':lf,'font-weight':700});fitText(lt,kw-12*s,6.5);});
    y+=8+nf+lf+5+14*s;
    const gf=Math.max(8.5,9.5*s); let gx=pad;
    D.legend.forEach(g=>{const t=txt(svg,gx,y+gf,g.t,{fill:g.c,'font-family':MONO,'font-size':gf,'font-weight':700});gx+=t.getComputedTextLength()+16*s});
    if(D.axisNote&&!compact){const an=txt(svg,W-pad,y+gf,D.axisNote,{fill:C.grey,'font-family':MONO,'font-size':gf*0.9,'text-anchor':'end'});if(gx>W-pad-an.getComputedTextLength()-10)an.remove()}
    y+=gf+6*s;
    const foot=Math.max(9,9*s)*(mid?2:1)*1.5+8;
    const evRoom=2*Math.max(8,9*s)*1.25+10;
    const top=y+evRoom, bottom=H-pad-foot-Math.max(10,11*s)-6;
    const left=pad+(D.yLeft?Math.max(26,34*s):0), right=W-pad-(D.yRight?Math.max(34,44*s):0);
    const cw=right-left, ch=Math.max(60,bottom-top);
    D.chart({svg,left,right,top,bottom:top+ch,cw,ch,s,compact,C,MONO,DISP,BODY,el,txt,tip,W,H});
    const ff=Math.max(8,8.5*s);
    (mid?D.footShort:[D.foot]).forEach((l,i,a)=>{const t=txt(svg,pad,H-pad-(a.length-1-i)*ff*1.5,l,{fill:C.grey,'font-family':MONO,'font-size':ff});fitText(t,W-2*pad,6)});
  }
  draw(); let t; window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,80)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
};
window.showTip=function(tip,html,x,y){tip.innerHTML=html;tip.hidden=false;const r=tip.getBoundingClientRect();let L=x+12,T=y-r.height-10;if(L+r.width>innerWidth-6)L=x-r.width-12;if(L<6)L=6;if(T<6)T=y+14;tip.style.left=L+'px';tip.style.top=T+'px'};
window.placeEvents=function(g,ev,xs,yTop,P,valY){
  const f=Math.max(8,9*P.s), lh=f*1.25, ends=[-1e9,-1e9];
  ev.forEach(e=>{const x=xs(e.i), lab=P.compact?e.short:e.long;
    const w=lab.length*f*0.62; let r=1; if(x-w/2<ends[1]+8){r=0} if(r===0&&x-w/2<ends[0]+8){r=1}
    ends[r]=x+w/2; const ty=yTop-(r?0:lh);
    let ax='middle',tx=x; if(x+w/2>P.W-6){ax='end';tx=x+4} if(x-w/2<6){ax='start';tx=x-4}
    P.el('line',{x1:x,x2:x,y1:ty+3,y2:Math.max(ty+4,valY(e.i)-5),stroke:P.C.ink,'stroke-width':0.7,'stroke-dasharray':'1 2'},g);
    P.txt(g,tx,ty,lab,{fill:P.C.red,'font-family':P.MONO,'font-size':f,'font-weight':700,'text-anchor':ax});
  });
};
})();
</script>
<script>
const days=["28/10","29/10","30/10","31/10*"];
const imp=[0,0.33,4.75,0.28];
const inter=[16.0,14.8,416.4,22.1];
const press=[5.26,1.74,9.91,5.40];
const nmat=[10,6,29,10];
const conv=[3.55,2.07,54.29,4.85];
const ev=[{i:0,long:'IESSI ADIA O SHOW',short:'ADIAMENTO'},{i:1,long:'IVETE NOS STORIES',short:'STORIES'},{i:2,long:'"FAZ O L" + FÃ-CLUBES',short:'"FAZ O L"'},{i:3,long:'DESCONTO NO CLAREOU',short:'DESCONTO'}];
renderInfo({aria:'Impactos, interações e conversas nas redes por dia, de 28 a 31 de outubro de 2026, sobre o adiamento do show A La Sangalo',
 kicker:'LISTENING / IVETE SANGALO / SHOW "A LA SANGALO" ADIADO / 28–31 OUT 2026', kickerShort:'A LA SANGALO ADIADO / 28–31 OUT',
 head:['5,4 milhões de views em 4 dias.'], headShort:['5,4 mi de views','em 4 dias.'],
 deck:['30/10 concentrou 4,8 mi de views e 416 mil interações, puxados por perfis que leram o adiamento','como "fracasso de vendas" e "castigo" pelo voto em Lula. Na imprensa, 22,3 mi de alcance potencial.'],
 deckShort:['30/10 concentra 89% dos views.','Imprensa: 22,3 mi de alcance potencial.'],
 kpis:[{n:'5,4 mi',l:'VIEWS NAS REDES',ls:'VIEWS',c:'#0F3B37'},{n:'22,3 mi',l:'ALCANCE POTENCIAL · IMPRENSA*',ls:'IMPRENSA*',c:'#B8892E'},{n:'469 mil',l:'INTERAÇÕES',ls:'INTERAÇÕES',c:'#B3202A'},{n:'65 mil',l:'CONVERSAS · COMENTÁRIOS',ls:'COMENTÁRIOS',c:'#E0566B'}],
 legend:[{t:'■ VIEWS',c:'#0F3B37'},{t:'— INTERAÇÕES',c:'#B3202A'},{t:'··· COMENTÁRIOS',c:'#E0566B'},{t:'■ IMPRENSA*',c:'#B8892E'}],
 axisNote:'EIXO DIREITO, EM VERMELHO: INTERAÇÕES E COMENTÁRIOS · ESCALA 25× MAIOR', yLeft:true, yRight:true,
 foot:'FONTE: EUPHORIA CREATIVE · Views = reels do Instagram + TikTok. *Imprensa: audiência média diária dos veículos que publicaram no dia (Comscore ago/26, visitantes únicos ÷ 30) — teto potencial, não leitura da matéria. *31/10 parcial.',
 footShort:['FONTE: EUPHORIA · reels do IG + TikTok. *Imprensa = audiência diária','dos veículos (Comscore ago/26): teto, não leitura. 31/10 parcial.'],
 chart(P){
  const {svg,left,right,top,bottom,cw,ch,s,compact,C,MONO,DISP,el,txt,tip}=P;
  const n=days.length, pad=cw*0.08, xs=i=>left+pad+(cw-2*pad)*(i/(n-1)), yL=v=>bottom-ch*v/12, yR=v=>bottom-ch*v/480;
  const g=el('g',{},svg); const af=Math.max(8,8.5*s);
  function fmt(v){return v.toLocaleString('pt-BR',{maximumFractionDigits:1})}
  [0,3,6,9,12].forEach(v=>{el('line',{x1:left,x2:right,y1:yL(v),y2:yL(v),stroke:C.rule,'stroke-width':v?0.5:0},g);txt(g,left-6,yL(v)+3,v?v+' mi':'0',{fill:C.grey,'font-family':MONO,'font-size':af,'text-anchor':'end'})});
  [0,120,240,360,480].forEach(v=>{txt(g,right+6,yR(v)+3,v?v+' mil':'0',{fill:C.red,'font-family':MONO,'font-size':af})});
  txt(g,right+6,yR(480)-10,'25×',{fill:C.red,'font-family':MONO,'font-size':af,'font-weight':700});
  const bw=Math.max(8,(cw-2*pad)/(n-1)*0.13);
  press.forEach((v,i)=>{if(!v)return;const x=i===n-1?xs(i)-bw-8:xs(i)+8;el('rect',{x,y:yL(v),width:bw,height:bottom-yL(v),fill:C.gold,opacity:0.95},g);
    txt(g,x+bw/2,yL(v)-4,fmt(v),{fill:C.gold,'font-family':MONO,'font-size':af,'font-weight':700,'text-anchor':'middle'})});
  let d=`M${xs(0)},${bottom}`; imp.forEach((v,i)=>d+=` L${xs(i)},${yL(v)}`); d+=` L${xs(n-1)},${bottom} Z`;
  el('path',{d,fill:C.ink,opacity:0.88},g);
  el('polyline',{points:inter.map((v,i)=>xs(i)+','+yR(v)).join(' '),fill:'none',stroke:C.red,'stroke-width':Math.max(1.8,2.6*s),'stroke-linejoin':'round'},g);
  el('polyline',{points:conv.map((v,i)=>xs(i)+','+yR(v)).join(' '),fill:'none',stroke:C.pink,'stroke-width':Math.max(1.8,2.4*s),'stroke-dasharray':'2 3','stroke-linecap':'round'},g);
  inter.forEach((v,i)=>el('circle',{cx:xs(i),cy:yR(v),r:Math.max(2.5,3.5*s),fill:C.red},g));
  el('line',{x1:left,x2:right,y1:bottom,y2:bottom,stroke:C.ink,'stroke-width':1.2},g);
  days.forEach((dd,i)=>txt(g,xs(i),bottom+af+6,dd,{fill:C.ink,'font-family':MONO,'font-size':af,'text-anchor':'middle'}));
  const vf=Math.max(10,13*s);
  txt(g,xs(2)-12,yL(4.75)-6,compact?'4,8 mi':'4,8 mi views',{fill:C.ink,'font-family':DISP,'font-size':vf,'font-weight':900,'text-anchor':'end'});
  txt(g,xs(2)-12,yR(416.4)+4,compact?'416 mil':'416 mil interações',{fill:C.red,'font-family':DISP,'font-size':vf,'font-weight':900,'text-anchor':'end'});
  placeEvents(g,ev,xs,top-4,P,i=>Math.min(yL(Math.max(imp[i],press[i]))-14,yR(inter[i])-6));
  days.forEach((dd,i)=>{const w=(cw-2*pad)/(n-1);const r=el('rect',{x:xs(i)-w/2,y:top,width:w,height:ch,fill:'transparent'},g);
    const h=e=>{const p=e.touches?e.touches[0]:e;showTip(tip,`<b>${dd}${i===3?' (parcial)':''}</b><br>${fmt(imp[i])} mi views<br>${fmt(inter[i])} mil interações<br>${fmt(conv[i])} mil comentários<br>${nmat[i]} matérias · ${fmt(press[i])} mi de audiência potencial`,p.clientX,p.clientY)};
    r.addEventListener('mousemove',h);r.addEventListener('touchstart',h,{passive:true});r.addEventListener('mouseleave',()=>tip.hidden=true)});
 }});
</script></body></html>
