<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter+Tight:wght@800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#FFFFFF}
#info{position:fixed;inset:0}
#info svg{display:block}
#tip{position:fixed;z-index:5;pointer-events:none;background:#111;color:#FFFFFF;font:600 12px/1.45 'Inter',system-ui,sans-serif;padding:8px 10px;border-radius:2px;max-width:240px}
#tip b{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.04em;color:#FFFFFF}
</style>

<title>Imprensa e canais oficiais · Listening YouTube</title></head><body>
<div id="info"></div><div id="tip" hidden></div>
<script>
// Infográficos do listening — SVG responsivo que sempre cabe na janela (sem rolagem)
(function(){
const C={paper:'#FFFFFF',ink:'#111111',red:'#E8352C',blue:'#1F5BFF',grey:'#8A867D',rule:'#CFCAC0'};
const DISP="'Inter Tight','Inter',system-ui,sans-serif", MONO="'IBM Plex Mono','DejaVu Sans Mono',monospace", BODY="'Inter',system-ui,sans-serif";
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,o){const t=el('text',Object.assign({x,y},o),p);t.textContent=s;return t}
function lines(p,x,y,arr,o,lh){arr.forEach((s,i)=>txt(p,x,y+i*lh,s,o))}

window.renderInfo=function(D){
  const root=document.getElementById('info'); const tip=document.getElementById('tip');
  function draw(){
    root.innerHTML='';
    const W=window.innerWidth,H=window.innerHeight;
    const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':D.aria},root);
    el('rect',{x:0,y:0,width:W,height:H,fill:C.paper},svg);
    const compact=W<620, tiny=H<380, mid=W<1200;
    const pad=Math.max(14,Math.min(W*0.035,40));
    const s=Math.max(0.62,Math.min(W/1100,H/700,1.25));
    let y=pad;
    const kf=Math.max(9,11*s);
    txt(svg,pad,y+kf,compact?D.kickerShort:D.kicker,{fill:C.red,'font-family':MONO,'font-size':kf,'font-weight':700,'letter-spacing':'0.04em'});
    y+=kf+8*s;
    const hf=Math.max(19,Math.min(44*s,W*(compact?0.075:0.045)));
    const hl=compact?D.headShort:D.head;
    txt(svg,pad,y+hf*0.9,hl[0],{fill:C.ink,'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'});
    y+=hf*1.08;
    if(hl[1]){txt(svg,pad,y+hf*0.9,hl[1],{fill:C.grey,'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'});y+=hf*1.08}
    const showDeck=!tiny&&H>460;
    if(showDeck){const df=Math.max(11,13*s);y+=6*s;lines(svg,pad,y+df,compact?D.deckShort:D.deck,{fill:C.ink,'font-family':BODY,'font-size':df},df*1.4);y+=df*1.4*(compact?D.deckShort:D.deck).length}
    y+=10*s;
    const kN=D.kpis.length, kw=(W-2*pad)/kN, nf=Math.max(18,Math.min(30*s,kw*0.28)), lf=Math.max(8.5,9.5*s);
    D.kpis.forEach((k,i)=>{const x=pad+i*kw;
      el('rect',{x,y,width:kw-10*s,height:3,fill:k.c},svg);
      txt(svg,x,y+8+nf,k.n,{fill:k.c,'font-family':DISP,'font-size':nf,'font-weight':900,'letter-spacing':'-0.02em'});
      txt(svg,x,y+8+nf+lf+5,(W<1000)?k.ls:k.l,{fill:C.ink,'font-family':MONO,'font-size':lf,'font-weight':700});});
    y+=8+nf+lf+5+14*s;
    const gf=Math.max(8.5,9.5*s); let gx=pad;
    ((compact&&D.legendShort)?D.legendShort:D.legend).forEach(g=>{const t=txt(svg,gx,y+gf,g.t,{fill:g.c,'font-family':MONO,'font-size':gf,'font-weight':700});gx+=t.getComputedTextLength()+16*s});
    if(D.axisNote&&W>=1000)txt(svg,W-pad,y+gf,D.axisNote,{fill:C.grey,'font-family':MONO,'font-size':gf*0.9,'text-anchor':'end'});
    y+=gf+6*s;
    const foot=Math.max(9,9*s)*(mid?2:1)*1.5+8;
    const evRoom=2*Math.max(8,9*s)*1.25+10;
    const top=y+evRoom, bottom=H-pad-foot-Math.max(10,11*s)-6;
    const left=pad+(D.yLeft?Math.max(26,34*s):0), right=W-pad-(D.yRight?Math.max(30,40*s):0);
    const cw=right-left, ch=Math.max(60,bottom-top);
    D.chart({svg,left,right,top,bottom:top+ch,cw,ch,s,compact,C,MONO,DISP,BODY,el,txt,tip,W,H});
    const ff=Math.max(8,8.5*s);
    lines(svg,pad,H-pad-(mid?ff*1.5:0),mid?D.footShort:[D.foot],{fill:C.grey,'font-family':MONO,'font-size':ff},ff*1.5);
  }
  draw(); let t; window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,80)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
};
window.showTip=function(tip,html,x,y){tip.innerHTML=html;tip.hidden=false;const r=tip.getBoundingClientRect();let L=x+12,T=y-r.height-10;if(L+r.width>innerWidth-6)L=x-r.width-12;if(L<6)L=6;if(T<6)T=y+14;tip.style.left=L+'px';tip.style.top=T+'px'};
})();
</script>
<script>
function placeEvents(g,ev,xs,yTop,P,valY){
  const f=Math.max(8,9*P.s), lh=f*1.25, ends=[-1e9,-1e9];
  ev.forEach(e=>{const x=xs(e.i), lab=P.compact?e.short:e.long;
    const w=lab.length*f*0.62; let r=1; if(x-w/2<ends[1]+8){r=0} if(r===0&&x-w/2<ends[0]+8){r=1}
    ends[r]=x+w/2; const ty=yTop-(r?0:lh);
    let ax='middle',tx=x; if(x+w/2>P.W-6){ax='end';tx=x+4} if(x-w/2<6){ax='start';tx=x-4}
    P.el('line',{x1:x,x2:x,y1:ty+3,y2:Math.max(ty+4,valY(e.i)-5),stroke:P.C.ink,'stroke-width':0.7,'stroke-dasharray':'1 2'},g);
    P.txt(g,tx,ty,lab,{fill:P.C.ink,'font-family':P.MONO,'font-size':f,'font-weight':700,'text-anchor':ax});
  });
}
</script>
<script>
// DADOS: matérias e comunicados por mês de publicação, por linha de produto
const days=['OUT/25','NOV','DEZ','JAN/26','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT/26'];
const dshort=['O','N','D','J','F','M','A','M','J','J','A','S','O'];
const M=[0,1,10,9,1,0,0,1,0,0,0,0,1], PL=[2,0,0,8,0,1,2,2,2,0,1,4,1], A=[1,0,1,1,4,6,4,10,3,3,1,0,8], S=[4,0,6,0,1,3,7,1,1,4,2,1,2], T=[1,3,5,1,5,2,1,5,7,5,1,7,1];
const tot=days.map((_,i)=>M[i]+PL[i]+A[i]+S[i]+T[i]);
const YMAX=25, TICKS=[0,5,10,15,20];
const ev=[{i:2,long:'RECAP + OSCAR 2029',short:'RECAP'},{i:3,long:'NOVA IDENTIDADE + CARTA',short:'IDENTID.'},{i:7,long:'BRANDCAST: "ERA YOUTUBE"',short:'BRANDCAST'},{i:8,long:'COPA NA CAZÉTV',short:'COPA'},{i:12,long:'BRANDCAST BRASIL',short:'BC BR'}];
const COL=['#111111','#E8352C','#1F5BFF','#7B3FE4','#C98A00'];
const who=[{p:'MARCA',a:39,n:23,c0:COL[0]},{p:'PLATAFORMA',a:22,n:23,c0:COL[1]},{p:'ANUNCIANTES',a:29,n:42,c0:COL[2]},{p:'MUSIC/PREMIUM',a:25,n:32,c0:COL[3]},{p:'TV/ESPORTES',a:27,n:44,c0:COL[4]}];
renderInfo({aria:'Matérias e comunicados oficiais sobre o YouTube por mês e por linha de produto, de outubro de 2025 a outubro de 2026',
 kicker:'LISTENING / YOUTUBE · POSICIONAMENTO DE MARCA / IMPRENSA E CANAIS OFICIAIS / OUT 2025 – OUT 2026', kickerShort:'YOUTUBE / IMPRENSA E CANAIS OFICIAIS',
 head:['Três picos redesenham a marca:','Recap, nova identidade e Brandcast.'], headShort:['Três picos:','Recap, logo, Brandcast.'],
 deck:['164 matérias e comunicados em 12 meses. TV e esportes (44) e anunciantes (42) lideram; a marca corporativa (23) se concentra em dez–jan.','28% têm recorte Brasil, puxado pela Copa na CazéTV (jun–jul) e pelo Brandcast Brasil, que trouxe a "Era YouTube" ao país (out/26).'],
 deckShort:['164 matérias e comunicados em 12 meses.','28% com recorte Brasil (Copa e Brandcast BR).'],
 kpis:[{n:'164',l:'MATÉRIAS E COMUNICADOS',ls:'MATÉRIAS',c:'#111111'},{n:'60',l:'FALAS OFICIAIS',ls:'OFICIAIS',c:'#E8352C'},{n:'46',l:'COM RECORTE BRASIL',ls:'BRASIL',c:'#1F5BFF'},{n:'2.950',l:'POSTS E VÍDEOS OFICIAIS',ls:'POSTS',c:'#C98A00'}],
 legend:[{t:'■ MARCA',c:COL[0]},{t:'■ PLATAFORMA/IA',c:COL[1]},{t:'■ ANUNCIANTES',c:COL[2]},{t:'■ MUSIC/PREMIUM',c:COL[3]},{t:'■ TV/ESPORTES',c:COL[4]}],
 legendShort:[{t:'■ MARCA',c:COL[0]},{t:'■ PLAT.',c:COL[1]},{t:'■ ANUNC.',c:COL[2]},{t:'■ MUSIC',c:COL[3]},{t:'■ TV/ESP.',c:COL[4]}],
 axisNote:'', yLeft:true, yRight:false,
 foot:'FONTE: EUPHORIA CREATIVE · matérias de mídia de negócios, publicidade e tecnologia + comunicados e eventos oficiais (blog.youtube, Google), por mês de publicação. Falas oficiais = comunicados, keynotes, entrevistas e campanhas. Out/26 parcial.',
 footShort:['FONTE: EUPHORIA · matérias + comunicados oficiais por mês;','falas oficiais = comunicados, keynotes, entrevistas. Out/26 parcial.'],
 chart(P){
  const {svg,left,top,bottom,ch,s,compact,C,MONO,DISP,el,txt,tip,W}=P; let right=P.right;
  const g=el('g',{},svg); const af=Math.max(8,8.5*s);
  const panel=W>=760; if(panel){const pw=Math.min(300,(right-left)*0.3); drawWho(right-pw+10,pw-10); right=right-pw-24}
  const cw=right-left, n=days.length, bw=cw/n, gap=Math.max(3,bw*0.22), xs=i=>left+bw*i+bw/2, y=v=>bottom-ch*v/YMAX;
  TICKS.forEach(v=>{el('line',{x1:left,x2:right,y1:y(v),y2:y(v),stroke:C.rule,'stroke-width':v?0.6:0},g);txt(g,left-6,y(v)+3,v,{fill:C.grey,'font-family':MONO,'font-size':af,'text-anchor':'end'})});
  days.forEach((dd,i)=>{let b=0;[M,PL,A,S,T].forEach((a,k)=>{const v=a[i];if(v){el('rect',{x:left+bw*i+gap/2,y:y(b+v),width:bw-gap,height:y(b)-y(b+v),fill:COL[k]},g);const hgt=y(b)-y(b+v);if(hgt>af*1.4&&bw>26)txt(g,xs(i),y(b+v/2)+3.5,v,{fill:C.paper,'font-family':MONO,'font-size':af,'text-anchor':'middle','font-weight':700})}b+=v});
    txt(g,xs(i),y(tot[i])-5,tot[i],{fill:C.ink,'font-family':DISP,'font-size':Math.max(10,12*s),'font-weight':900,'text-anchor':'middle'});
    txt(g,xs(i),bottom+af+6,bw<44?dshort[i]:dd,{fill:C.ink,'font-family':MONO,'font-size':af,'text-anchor':'middle'});
    const r=el('rect',{x:left+bw*i,y:top,width:bw,height:ch,fill:'transparent'},g);
    const h=e=>{const p=e.touches?e.touches[0]:e;showTip(tip,`<b>${dd}</b><br>${tot[i]} matérias e comunicados<br>Marca ${M[i]} · Plataforma ${PL[i]}<br>Anunciantes ${A[i]} · Music/Premium ${S[i]}<br>TV/esportes ${T[i]}`,p.clientX,p.clientY)};
    r.addEventListener('mousemove',h);r.addEventListener('touchstart',h,{passive:true});r.addEventListener('mouseleave',()=>tip.hidden=true)});
  el('line',{x1:left,x2:right,y1:bottom,y2:bottom,stroke:C.ink,'stroke-width':1.2},g);
  placeEvents(g,ev,xs,top-4,P,i=>y(tot[i])-14);
  function drawWho(x0,pw){
    const f=Math.max(8,8.5*s); let yy=top-4;
    txt(g,x0,yy,'RECORTE BRASIL POR LINHA',{fill:C.red,'font-family':MONO,'font-size':f,'font-weight':700});
    el('line',{x1:x0-12,x2:x0-12,y1:top-14,y2:bottom,stroke:C.rule,'stroke-width':1},g);
    const rowH=(bottom-yy-8)/who.length;
    who.forEach((w,k)=>{const ry=yy+8+k*rowH; const nf=Math.min(rowH*0.34,22*s);
      txt(g,x0,ry+nf,w.p,{fill:w.c0,'font-family':DISP,'font-size':nf*0.8,'font-weight':900});
      txt(g,x0+pw,ry+nf,'n='+w.n,{fill:C.grey,'font-family':MONO,'font-size':f,'text-anchor':'end'});
      const by=ry+nf+6, bh=Math.max(5,rowH*0.14);
      el('rect',{x:x0,y:by,width:pw*w.a/100,height:bh,fill:'#1F5BFF'},g);
      el('rect',{x:x0+pw*w.a/100,y:by,width:pw*(100-w.a)/100,height:bh,fill:'#CFCAC0'},g);
      txt(g,x0,by+bh+f*1.3,w.a+'% BRASIL',{fill:'#1F5BFF','font-family':MONO,'font-size':f,'font-weight':700});
      txt(g,x0+pw,by+bh+f*1.3,(100-w.a)+'% GLOBAL',{fill:C.grey,'font-family':MONO,'font-size':f,'font-weight':700,'text-anchor':'end'})});
  }
 }});
</script>

</body></html>
