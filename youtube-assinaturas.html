    ends[r]=x+w/2; const ty=yTop-(r?0:lh);
    let ax='middle',tx=x; if(x+w/2>P.W-6){ax='end';tx=x+4} if(x-w/2<6){ax='start';tx=x-4}

  if(!window.__sigClick){window.__sigClick=1;document.addEventListener('click',ev=>{if(!tip.contains(ev.target)&&!ev.target.closest('.card')){pinned=null;tip.hidden=true;tip.classList.remove('pin')}})}
  PH.forEach((p,i)=>{const x=left+i*(colW+gap);
    el('rect',{x,y:top,width:colW,height:hh,fill:p.bg},g);
    const t1=txt(g,x+padX,top+hh*0.45,compact?p.ts:p.t,{fill:p.fg,'font-family':MONO,'font-size':af,'font-weight':700});
    if(t1.getComputedTextLength()>colW-2*padX)t1.textContent=p.ts;
    txt(g,x+padX,top+hh*0.82,p.r,{fill:p.fg,'font-family':MONO,'font-size':af*0.92,opacity:0.8});
    SG.filter(e=>e.ph===i).forEach((e,j)=>{const y=y0+j*(cardH+vg), c=LN[e.l].c, inv=!!e.k;
      const cg=el('g',{class:'card',style:'cursor:pointer',role:'button',tabindex:0,'aria-label':e.q},g);
      el('rect',{x,y,width:colW,height:cardH,fill:inv?c:'#F4F2EE'},cg);
      if(!inv)el('rect',{x,y,width:4,height:cardH,fill:c},cg);
      const fg=inv?'#FFFFFF':'#111111';
      const dY=inline?y+cardH/2+dateF*0.35:y+padX*0.5+dateF;
      txt(cg,x+padX+(inv?0:2),dY,inline?e.t.replace(' → ','→'):e.t,{fill:inv?'#FFFFFF':C.grey,'font-family':MONO,'font-size':dateF,'font-weight':700,opacity:inv?0.85:1});
      const tag=txt(cg,x+colW-padX,dY,(e.br?'BR ':'')+'↗',{fill:inv?'#FFFFFF':(e.br?'#1F5BFF':c),'font-family':MONO,'font-size':dateF,'font-weight':700,'text-anchor':'end'});
      const r=wrap(compact?e.qs:e.q,inline?tw-dateW-tagW:tw,qf);
      if(inline)txt(cg,x+padX+(inv?0:2)+dateW,y+cardH/2+qf*0.35,r.out[0],{fill:fg,'font-family':DISP,'font-size':qf,'font-weight':900,'letter-spacing':'-0.01em'});
      else r.out.forEach((ln,k)=>txt(cg,x+padX+(inv?0:2),y+padX*0.5+metaH+qf*0.92+k*qf*1.08,ln,{fill:fg,'font-family':DISP,'font-size':qf,'font-weight':900,'letter-spacing':'-0.01em'}));
      if(e.br&&inv)el('rect',{x:x+colW-6,y,width:6,height:cardH,fill:'#1F5BFF'},cg);
      const box=()=>cg.getBoundingClientRect();
      cg.addEventListener('mouseenter',()=>show(e,box()));
      cg.addEventListener('mouseleave',()=>{if(pinned!==e)hide()});
      cg.addEventListener('click',ev=>{ev.stopPropagation();pinned=e;show(e,box())});
      cg.addEventListener('keydown',ev=>{if(ev.key==='Enter'){pinned=e;show(e,box())}});
    });
  });
  probe.remove();
 }});
</script>
